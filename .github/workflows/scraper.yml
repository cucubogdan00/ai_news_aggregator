name: AI News Scraper Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-cron]

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Cache Hugging Face Model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: huggingface-${{ runner.os }}-distilbert
        restore-keys: |
          huggingface-${{ runner.os }}-

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Scraper and analyze sentiment
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python scraper.py

    - name: Commit and push database memory
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -f news.db
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update database memory" && git push)